# ==============================================================================
# AFENDOR CHAT - NGINX HOST REVERSE PROXY CONFIGURATION
# Location on VPS: /etc/nginx/sites-available/afendor.conf
# Enable: ln -sf /etc/nginx/sites-available/afendor.conf /etc/nginx/sites-enabled/
# Test & Reload: nginx -t && systemctl reload nginx
# ==============================================================================

# Common WebSocket & Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS REDIRECT FOR ALL AFENDOR DOMAINS & ACME CHALLENGE
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name afendor.cc *.afendor.cc;

    # ACME Challenge Directory for Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. APEX DOMAIN (afendor.cc) -> REDIRECT TO WEB APP (web.afendor.cc)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name afendor.cc www.afendor.cc;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/afendor.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afendor.cc/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AfendorSSL:50m;
    ssl_session_tickets off;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Handle ACME challenge in HTTPS as well in case of forced redirects
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Pass discovery endpoints directly to backend edge dispatcher
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all user web traffic to web.afendor.cc
    location / {
        return 301 https://web.afendor.cc$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 3. MAIN WEB APP, API, GATEWAY, MEDIA, CDN, ADMIN (subdomains)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.afendor.cc api.afendor.cc gateway.afendor.cc media.afendor.cc admin.afendor.cc;

    # SSL Certificate Configuration (Preserves existing Let's Encrypt / custom certs)
    ssl_certificate /etc/letsencrypt/live/afendor.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afendor.cc/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AfendorSSL:50m;
    ssl_session_tickets off;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Upload size limit for file attachments
    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Timeouts for Long-Polling / WebSockets
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;

    # Handle ACME challenge in HTTPS as well in case of forced redirects
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Route everything to Afendor Edge Ingress Dispatcher
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
    }
}

# ------------------------------------------------------------------------------
# 3. LIVEKIT WEBRTC SIGNALING (livekit.afendor.cc)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name livekit.afendor.cc;

    ssl_certificate /etc/letsencrypt/live/afendor.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afendor.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # ACME challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # LiveKit HTTP & WebSocket Signaling Port
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_buffering off;
    }
}
