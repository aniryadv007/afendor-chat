      AFENDOR_MEDIA_PROXY_CORS_ALLOWED_ORIGINS: ${AFENDOR_MEDIA_PROXY_CORS_ALLOWED_ORIGINS:-${AFENDOR_PUBLIC_ORIGIN:-${AFENDOR_PUBLIC_SCHEME:-https}://${AFENDOR_DOMAIN:-}:${AFENDOR_PUBLIC_PORT:-443}}}
