      AFENDOR_MEDIA_PROXY_NSFW_THRESHOLD: ${AFENDOR_MEDIA_PROXY_NSFW_THRESHOLD:-}
      AFENDOR_NSFW_SERVICE_ENDPOINT: ${AFENDOR_NSFW_SERVICE_ENDPOINT:-}
      AFENDOR_MEDIA_PROXY_MAX_NATIVE_TRANSFORMS: ${AFENDOR_MEDIA_PROXY_MAX_NATIVE_TRANSFORMS:-}
      AFENDOR_MEDIA_PROXY_WORKER_QUEUE_CAPACITY: ${AFENDOR_MEDIA_PROXY_WORKER_QUEUE_CAPACITY:-}
      AFENDOR_MEDIA_PROXY_MAX_ENCODE_DURATION_MS: ${AFENDOR_MEDIA_PROXY_MAX_ENCODE_DURATION_MS:-}
      AFENDOR_MEDIA_PROXY_MAX_ENCODE_FRAMES: ${AFENDOR_MEDIA_PROXY_MAX_ENCODE_FRAMES:-}
