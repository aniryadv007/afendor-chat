x-fluxer-rust-env: &fluxer-rust-env
  <<: *fluxer-env
  TOKIO_WORKER_THREADS: ${AFENDOR_TOKIO_WORKER_THREADS:-2}
  MALLOC_ARENA_MAX: ${AFENDOR_MALLOC_ARENA_MAX:-2}

x-fluxer-logging: &fluxer-logging
  driver: json-file
  options:
    max-size: ${AFENDOR_LOG_MAX_SIZE:-10m}
    max-file: "${AFENDOR_LOG_MAX_FILE:-3}"

x-fluxer-service: &fluxer-service
  restart: ${AFENDOR_RESTART_POLICY:-unless-stopped}
  networks: [fluxer]
  logging: *fluxer-logging

x-fluxer-healthcheck: &fluxer-healthcheck
  interval: ${AFENDOR_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${AFENDOR_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${AFENDOR_HEALTHCHECK_RETRIES:-10}
  start_period: ${AFENDOR_HEALTHCHECK_START_PERIOD:-60s}
  start_interval: ${AFENDOR_HEALTHCHECK_START_INTERVAL:-1s}

x-fluxer-app-healthcheck: &fluxer-app-healthcheck
  interval: ${AFENDOR_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${AFENDOR_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${AFENDOR_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${AFENDOR_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: ${AFENDOR_HEALTHCHECK_START_INTERVAL:-1s}

x-fluxer-svc-healthcheck: &fluxer-svc-healthcheck
  <<: *fluxer-app-healthcheck
  start_period: ${AFENDOR_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]

services:
  edge:
    <<: *fluxer-service
    image: ${AFENDOR_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_CADDY_MEMORY_LIMIT:-384mb}
    ports:
      - "${AFENDOR_EDGE_LISTEN_ADDRESS:+[${AFENDOR_EDGE_LISTEN_ADDRESS}]:}${AFENDOR_HTTP_PORT:-80}:80"
      - "${AFENDOR_EDGE_LISTEN_ADDRESS:+[${AFENDOR_EDGE_LISTEN_ADDRESS}]:}${AFENDOR_HTTPS_PORT:-443}:443"
      - "${AFENDOR_EDGE_LISTEN_ADDRESS:+[${AFENDOR_EDGE_LISTEN_ADDRESS}]:}${AFENDOR_HTTPS_PORT:-443}:443/udp"
    environment:
      AFENDOR_EDGE_SITE_ADDRESS: ${AFENDOR_EDGE_SITE_ADDRESS:-${AFENDOR_CADDY_SITE_ADDRESS:-${AFENDOR_PUBLIC_SCHEME:-https}://${AFENDOR_DOMAIN:-}}}
      AFENDOR_EDGE_TRUSTED_PROXIES: ${AFENDOR_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      AFENDOR_EDGE_ENCODE: ${AFENDOR_EDGE_ENCODE:-zstd gzip}
      AFENDOR_EDGE_PROTOCOLS: ${AFENDOR_EDGE_PROTOCOLS:-h1 h2 h3}
      AFENDOR_EDGE_GLOBAL_OPTIONS: ${AFENDOR_EDGE_GLOBAL_OPTIONS:-}
      AFENDOR_EDGE_TLS_DIRECTIVE: ${AFENDOR_EDGE_TLS:+tls ${AFENDOR_EDGE_TLS:-}}
      AFENDOR_ADMIN_BASE_PATH: ${AFENDOR_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      <<: *fluxer-healthcheck
    depends_on:
      api: {condition: service_healthy}
      gateway: {condition: service_healthy}

  postgres:
    <<: *fluxer-service
    image: ${AFENDOR_POSTGRES_IMAGE:-postgres:16-alpine}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${AFENDOR_POSTGRES_MEMORY_RESERVATION:-3gb}
    command: >
      postgres
      -c max_connections=${AFENDOR_POSTGRES_SERVER_MAX_CONNECTIONS:-150}
      -c shared_buffers=${AFENDOR_POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${AFENDOR_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${AFENDOR_POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${AFENDOR_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${AFENDOR_POSTGRES_AUTOVACUUM_WORK_MEM:-128MB}
      -c random_page_cost=${AFENDOR_POSTGRES_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${AFENDOR_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      -c default_statistics_target=${AFENDOR_POSTGRES_DEFAULT_STATISTICS_TARGET:-200}
      -c jit=${AFENDOR_POSTGRES_JIT:-off}
      -c min_wal_size=${AFENDOR_POSTGRES_MIN_WAL_SIZE:-80MB}
      -c max_wal_size=${AFENDOR_POSTGRES_MAX_WAL_SIZE:-2GB}
      -c checkpoint_completion_target=${AFENDOR_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      -c wal_buffers=${AFENDOR_POSTGRES_WAL_BUFFERS:-16MB}
      -c wal_compression=${AFENDOR_POSTGRES_WAL_COMPRESSION:-zstd}
      -c bgwriter_delay=${AFENDOR_POSTGRES_BGWRITER_DELAY:-50ms}
      -c bgwriter_lru_maxpages=${AFENDOR_POSTGRES_BGWRITER_LRU_MAXPAGES:-1000}
      -c autovacuum_vacuum_scale_factor=${AFENDOR_POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05}
      -c autovacuum_analyze_scale_factor=${AFENDOR_POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02}
      -c autovacuum_vacuum_cost_limit=${AFENDOR_POSTGRES_AUTOVACUUM_VACUUM_COST_LIMIT:-2000}
      -c autovacuum_max_workers=${AFENDOR_POSTGRES_AUTOVACUUM_MAX_WORKERS:-3}
      -c max_parallel_workers_per_gather=${AFENDOR_POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      -c max_parallel_workers=${AFENDOR_POSTGRES_MAX_PARALLEL_WORKERS:-8}
      -c track_io_timing=${AFENDOR_POSTGRES_TRACK_IO_TIMING:-on}
      -c shared_preload_libraries=${AFENDOR_POSTGRES_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}
    shm_size: ${AFENDOR_POSTGRES_SHM_SIZE:-1gb}
    environment:
      POSTGRES_DB: ${AFENDOR_POSTGRES_DATABASE:-fluxer}
      POSTGRES_USER: ${AFENDOR_POSTGRES_USERNAME:-fluxer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      <<: *fluxer-healthcheck

  valkey:
    <<: *fluxer-service
    image: ${AFENDOR_VALKEY_IMAGE:-valkey/valkey:9.1-alpine}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_VALKEY_MEMORY_LIMIT:-256mb}
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "${AFENDOR_VALKEY_APPENDFSYNC:-everysec}", "--dir", "/data",
              "--save", "${AFENDOR_VALKEY_SAVE:-}",
              "--maxmemory", "${AFENDOR_VALKEY_MAXMEMORY:-192mb}",
              "--maxmemory-policy", "${AFENDOR_VALKEY_MAXMEMORY_POLICY:-noeviction}"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *fluxer-healthcheck

  nats:
    <<: *fluxer-service
    image: ${AFENDOR_NATS_IMAGE:-nats:2.14-alpine}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_NATS_MEMORY_LIMIT:-256mb}
    environment:
      GOMEMLIMIT: ${AFENDOR_NATS_GOMEMLIMIT:-200MiB}
      AFENDOR_NATS_MAX_MEMORY_STORE: ${AFENDOR_NATS_MAX_MEMORY_STORE:-64MB}
      AFENDOR_NATS_MAX_FILE_STORE: ${AFENDOR_NATS_MAX_FILE_STORE:-10GB}
    command:
      - sh
      - -c
      - >
        printf 'http_port: 8222\njetstream {\n  store_dir: /data\n  max_memory_store: %s\n  max_file_store: %s\n}\n'
        "$$AFENDOR_NATS_MAX_MEMORY_STORE" "$$AFENDOR_NATS_MAX_FILE_STORE" > /tmp/nats.conf
        && exec nats-server -c /tmp/nats.conf
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      <<: *fluxer-healthcheck

  meilisearch:
    <<: *fluxer-service
    image: ${AFENDOR_MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.53}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_MEILISEARCH_MEMORY_LIMIT:-1536mb}
    environment:
      MEILI_ENV: ${AFENDOR_MEILISEARCH_ENV:-production}
      MEILI_NO_ANALYTICS: "${AFENDOR_MEILISEARCH_NO_ANALYTICS:-true}"
      MEILI_UPGRADE_DB: "true"
      MEILI_MAX_INDEXING_MEMORY: ${AFENDOR_MEILISEARCH_MAX_INDEXING_MEMORY:-256mb}
      MEILI_MAX_INDEXING_THREADS: ${AFENDOR_MEILISEARCH_MAX_INDEXING_THREADS:-2}
      MEILI_LOG_LEVEL: ${AFENDOR_MEILISEARCH_LOG_LEVEL:-WARN}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      <<: *fluxer-healthcheck

  seaweedfs:
    <<: *fluxer-service
    image: ${AFENDOR_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_SEAWEEDFS_MEMORY_LIMIT:-2gb}
    environment:
      GOMEMLIMIT: ${AFENDOR_SEAWEEDFS_GOMEMLIMIT:-1536MiB}
      WEED_MASTER_VOLUME_GROWTH_COPY_1: ${AFENDOR_SEAWEEDFS_VOLUME_GROWTH:-1}
    command: ["server", "-s3", "-s3.iam=false", "-dir=/data", "-master.telemetry=${AFENDOR_SEAWEEDFS_TELEMETRY:-false}", "-master.volumeSizeLimitMB=${AFENDOR_SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}", "-master.garbageThreshold=${AFENDOR_SEAWEEDFS_GARBAGE_THRESHOLD:-0.1}", "-volume.max=${AFENDOR_SEAWEEDFS_VOLUME_MAX:-10000}", "-s3.concurrentFileUploadLimit=${AFENDOR_SEAWEEDFS_S3_CONCURRENT_UPLOADS:-5}"]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      <<: *fluxer-healthcheck
      retries: ${AFENDOR_SEAWEEDFS_HEALTHCHECK_RETRIES:-20}
      start_period: ${AFENDOR_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}

  seaweedfs-init:
    image: ${AFENDOR_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [fluxer]
    logging: *fluxer-logging
    depends_on:
      seaweedfs: {condition: service_healthy, restart: true}
    restart: "no"
    environment:
      AFENDOR_S3_ACCESS_KEY: ${AFENDOR_S3_ACCESS_KEY:-}
      AFENDOR_S3_SECRET_KEY: ${AFENDOR_S3_SECRET_KEY:-}
      AFENDOR_S3_BUCKET_CDN: ${AFENDOR_S3_BUCKET_CDN:-fluxer}
      AFENDOR_S3_BUCKET_UPLOADS: ${AFENDOR_S3_BUCKET_UPLOADS:-fluxer-uploads}
      AFENDOR_S3_BUCKET_REPORTS: ${AFENDOR_S3_BUCKET_REPORTS:-fluxer-reports}
      AFENDOR_S3_BUCKET_HARVESTS: ${AFENDOR_S3_BUCKET_HARVESTS:-fluxer-harvests}
      AFENDOR_SEAWEEDFS_INIT_ATTEMPTS: ${AFENDOR_SEAWEEDFS_INIT_ATTEMPTS:-60}
      AFENDOR_SEAWEEDFS_UPLOADS_TTL: ${AFENDOR_SEAWEEDFS_UPLOADS_TTL:-1d}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$AFENDOR_S3_BUCKET_CDN $$AFENDOR_S3_BUCKET_UPLOADS $$AFENDOR_S3_BUCKET_REPORTS $$AFENDOR_S3_BUCKET_HARVESTS";
        missing="$$buckets";
        for attempt in $$(seq 1 $$AFENDOR_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          failure="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if [ "$$AFENDOR_SEAWEEDFS_UPLOADS_TTL" = off ]; then
              ttl_rule="fs.configure -locationPrefix=/buckets/$$AFENDOR_S3_BUCKET_UPLOADS/ -delete -apply";
            else
              ttl_rule="fs.configure -locationPrefix=/buckets/$$AFENDOR_S3_BUCKET_UPLOADS/ -ttl=$$AFENDOR_SEAWEEDFS_UPLOADS_TTL -apply";
            fi;
            failure="could not configure the S3 identity";
            if echo "s3.configure -user=fluxer -access_key=$$AFENDOR_S3_ACCESS_KEY -secret_key=$$AFENDOR_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              failure="could not set the expiry of $$AFENDOR_S3_BUCKET_UPLOADS";
              if echo "$$ttl_rule" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
                echo "buckets ready";
                exit 0;
              fi;
            fi;
            sleep 2;
            continue;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        if [ -n "$$failure" ]; then
          echo "seaweedfs-init $$failure" >&2;
        else
          echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        fi;
        exit 1;

  livekit:
    <<: *fluxer-service
    image: ${AFENDOR_LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_LIVEKIT_MEMORY_LIMIT:-512mb}
    environment:
      GOMEMLIMIT: ${AFENDOR_LIVEKIT_GOMEMLIMIT:-435MiB}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${AFENDOR_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${AFENDOR_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${AFENDOR_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${AFENDOR_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${AFENDOR_LIVEKIT_NODE_IP:-}"
          stun_servers:
            - ${AFENDOR_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${AFENDOR_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
          turn_servers: ${AFENDOR_LIVEKIT_TURN_SERVERS:-[]}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://api:8080/webhooks/livekit
    ports:
      - "${AFENDOR_LIVEKIT_TCP_PORT:-7881}:${AFENDOR_LIVEKIT_TCP_PORT:-7881}"
      - "${AFENDOR_LIVEKIT_UDP_PORT:-7882}:${AFENDOR_LIVEKIT_UDP_PORT:-7882}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      <<: *fluxer-healthcheck

  api:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-api:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_API_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${AFENDOR_API_MEMORY_RESERVATION:-1gb}
    environment:
      <<: *fluxer-env
      AFENDOR_API_PORT: "8080"
      AFENDOR_SETUP_TOKEN: ${AFENDOR_SETUP_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size${AFENDOR_API_NODE_HEAP_MB:+=}${AFENDOR_API_NODE_HEAP_MB:--percentage=60}${AFENDOR_API_NODE_OPTIONS:+ ${AFENDOR_API_NODE_OPTIONS:-}}
      NODE_EXTRA_CA_CERTS: ${AFENDOR_NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      AFENDOR_POSTGRES_MAX_CONNECTIONS: "${AFENDOR_API_POSTGRES_MAX_CONNECTIONS:-25}"
      AFENDOR_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: "${AFENDOR_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED:-true}"
      AFENDOR_API_EMBEDDED_WORKER: "${AFENDOR_API_EMBEDDED_WORKER:-false}"
      AFENDOR_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${AFENDOR_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
    volumes:
      - ./ca:/etc/fluxer/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *fluxer-app-healthcheck
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      seaweedfs-init: {condition: service_completed_successfully}
      gifs: {condition: service_healthy}
      snowflakes: {condition: service_healthy}
      messages: {condition: service_healthy}
      users: {condition: service_healthy}

  worker:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-api:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      replicas: ${AFENDOR_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${AFENDOR_WORKER_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${AFENDOR_WORKER_MEMORY_RESERVATION:-1gb}
    command: ["node", "dist/WorkerEntrypoint.js"]
    environment:
      <<: *fluxer-env
      NODE_OPTIONS: --max-old-space-size${AFENDOR_WORKER_NODE_HEAP_MB:+=}${AFENDOR_WORKER_NODE_HEAP_MB:--percentage=55}${AFENDOR_WORKER_NODE_OPTIONS:+ ${AFENDOR_WORKER_NODE_OPTIONS:-}}
      NODE_EXTRA_CA_CERTS: ${AFENDOR_NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      AFENDOR_API_WORKER_MODE: all_lanes
      AFENDOR_API_WORKER_ENABLE_CRON_SCHEDULER: "true"
      AFENDOR_POSTGRES_MAX_CONNECTIONS: "${AFENDOR_WORKER_POSTGRES_MAX_CONNECTIONS:-25}"
      AFENDOR_WORKER_POSTGRES_SYNCHRONOUS_COMMIT: "${AFENDOR_WORKER_POSTGRES_SYNCHRONOUS_COMMIT:-}"
      AFENDOR_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${AFENDOR_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
    volumes:
      - ./ca:/etc/fluxer/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/fluxer-worker-heartbeat -newermt '-30 seconds' | grep -q ."]
      <<: *fluxer-app-healthcheck
      retries: ${AFENDOR_WORKER_HEALTHCHECK_RETRIES:-3}
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_healthy}
      seaweedfs-init: {condition: service_completed_successfully}
      snowflakes: {condition: service_healthy}
      messages: {condition: service_healthy}
      users: {condition: service_healthy}

  gateway:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-gateway:${AFENDOR_IMAGE_TAG:-v1}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_GATEWAY_MEMORY_LIMIT:-1gb}
        reservations:
          memory: ${AFENDOR_GATEWAY_MEMORY_RESERVATION:-384mb}
    environment:
      <<: *fluxer-env
      AFENDOR_GATEWAY_PORT: "8080"
      AFENDOR_GATEWAY_MEDIA_PROXY_ENDPOINT: ${AFENDOR_GATEWAY_MEDIA_PROXY_ENDPOINT:-${AFENDOR_MEDIA_ENDPOINT:-${AFENDOR_PUBLIC_ORIGIN:-${AFENDOR_PUBLIC_SCHEME:-https}://${AFENDOR_DOMAIN:-}}/media}}
      AFENDOR_GATEWAY_STATIC_CDN_ENDPOINT: ${AFENDOR_GATEWAY_STATIC_CDN_ENDPOINT:-${AFENDOR_STATIC_CDN_ENDPOINT:-${AFENDOR_PUBLIC_ORIGIN:-${AFENDOR_PUBLIC_SCHEME:-https}://${AFENDOR_DOMAIN:-}}}}
      AFENDOR_GATEWAY_LOGGER_LEVEL: ${AFENDOR_GATEWAY_LOGGER_LEVEL:-}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-}
      AFENDOR_GATEWAY_PUSH_ENABLED: ${AFENDOR_GATEWAY_PUSH_ENABLED:-}
      AFENDOR_GATEWAY_PUSH_ENROLLED_CLEAR_NOTIFICATIONS_ENABLED: ${AFENDOR_GATEWAY_PUSH_ENROLLED_CLEAR_NOTIFICATIONS_ENABLED:-}
      AFENDOR_GATEWAY_PUSH_OUTBOX_REQUEST_TIMEOUT_MS: ${AFENDOR_GATEWAY_PUSH_OUTBOX_REQUEST_TIMEOUT_MS:-}
      AFENDOR_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_ENTRIES: ${AFENDOR_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_ENTRIES:-}
      AFENDOR_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_BYTES: ${AFENDOR_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_BYTES:-}
      AFENDOR_GATEWAY_HTTP_RPC_MAX_CONCURRENCY: ${AFENDOR_GATEWAY_HTTP_RPC_MAX_CONCURRENCY:-}
      AFENDOR_GATEWAY_NATS_RPC_MAX_HANDLERS: ${AFENDOR_GATEWAY_NATS_RPC_MAX_HANDLERS:-}
      AFENDOR_GATEWAY_ZSTD_WINDOW_LOG: ${AFENDOR_GATEWAY_ZSTD_WINDOW_LOG:-}
      AFENDOR_GATEWAY_HTTP_FAILURE_THRESHOLD: ${AFENDOR_GATEWAY_HTTP_FAILURE_THRESHOLD:-}
      AFENDOR_GATEWAY_HTTP_RECOVERY_TIMEOUT_MS: ${AFENDOR_GATEWAY_HTTP_RECOVERY_TIMEOUT_MS:-}
      AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_MAX: ${AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_MAX:-}
      AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_FLOOR: ${AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_FLOOR:-}
      AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_PER_MEMBER: ${AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_PER_MEMBER:-}
      AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_PER_USER: ${AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_PER_USER:-}
      AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_PER_IP: ${AFENDOR_GATEWAY_GUILD_VISITOR_SESSIONS_PER_IP:-}
      AFENDOR_ERLANG_COOKIE: ${AFENDOR_ERLANG_COOKIE:-}
      AFENDOR_ERLANG_SCHEDULERS: ${AFENDOR_ERLANG_SCHEDULERS:-}
      AFENDOR_ERLANG_SCHEDULERS_MIN: ${AFENDOR_ERLANG_SCHEDULERS_MIN:-}
      AFENDOR_ERLANG_SCHEDULERS_MAX: ${AFENDOR_ERLANG_SCHEDULERS_MAX:-}
      AFENDOR_ERLANG_DIRTY_CPU_SCHEDULERS: ${AFENDOR_ERLANG_DIRTY_CPU_SCHEDULERS:-}
      AFENDOR_ERLANG_DIRTY_IO_SCHEDULERS: ${AFENDOR_ERLANG_DIRTY_IO_SCHEDULERS:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health/ready HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *fluxer-app-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      valkey: {condition: service_healthy}

  media-proxy:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-media-proxy:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_MEDIA_PROXY_MEMORY_LIMIT:-1gb}
    environment:
      <<: *fluxer-env
      AFENDOR_MEDIA_PROXY_PORT: "8080"
      TOKIO_WORKER_THREADS: ${AFENDOR_MEDIA_PROXY_TOKIO_WORKER_THREADS:-4}
      AFENDOR_MEDIA_PROXY_MODE: upload
      AFENDOR_MEDIA_PROXY_STORAGE_BACKEND: s3
