      AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_MAX_TOTAL_BYTES: ${AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_MAX_TOTAL_BYTES:-2147483648}
      AFENDOR_S3_SESSION_TOKEN: ${AFENDOR_S3_SESSION_TOKEN:-}
      AFENDOR_S3_READ_ENDPOINT: ${AFENDOR_S3_READ_ENDPOINT:-}
      AFENDOR_S3_READ_BUCKET: ${AFENDOR_S3_READ_BUCKET:-}
      AFENDOR_S3_READ_BUCKET_STYLE: ${AFENDOR_S3_READ_BUCKET_STYLE:-}
      AFENDOR_S3_READ_SIGNED: "${AFENDOR_S3_READ_SIGNED:-true}"
    volumes:
      - media-proxy-tmp:/tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/fluxer-media-proxy", "healthcheck"]
      <<: *fluxer-healthcheck
      interval: ${AFENDOR_MEDIA_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      seaweedfs-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  push:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-push:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_PUSH_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_PUSH_SERVICE_QUEUE_CAPACITY: ${AFENDOR_PUSH_SERVICE_QUEUE_CAPACITY:-}
      AFENDOR_PUSH_SERVICE_SEND_CONCURRENCY: ${AFENDOR_PUSH_SERVICE_SEND_CONCURRENCY:-}
      AFENDOR_PUSH_SERVICE_APNS_BASE_URL: ${AFENDOR_PUSH_SERVICE_APNS_BASE_URL:-}
      AFENDOR_PUSH_SERVICE_FCM_BASE_URL: ${AFENDOR_PUSH_SERVICE_FCM_BASE_URL:-}
      AFENDOR_PUSH_SERVICE_MANAGED_RELAY_HOSTS: ${AFENDOR_PUSH_SERVICE_MANAGED_RELAY_HOSTS:-}
      AFENDOR_PUSH_SERVICE_OWN_RELAY_HOSTS: ${AFENDOR_PUSH_SERVICE_OWN_RELAY_HOSTS:-}
      AFENDOR_PUSH_SERVICE_PRIVATE_HOSTS: ${AFENDOR_PUSH_SERVICE_PRIVATE_HOSTS:-}
      AFENDOR_PUSH_SERVICE_RELAY_CONSENT_ACCEPTED: ${AFENDOR_PUSH_SERVICE_RELAY_CONSENT_ACCEPTED:-}
      AFENDOR_PUSH_APNS_DEFAULT_ENVIRONMENT: ${AFENDOR_PUSH_APNS_DEFAULT_ENVIRONMENT:-}
      AFENDOR_PUSH_FCM_ENABLED: ${AFENDOR_PUSH_FCM_ENABLED:-}
      AFENDOR_PUSH_FCM_PROJECT_ID: ${AFENDOR_PUSH_FCM_PROJECT_ID:-}
      AFENDOR_PUSH_FCM_CLIENT_EMAIL: ${AFENDOR_PUSH_FCM_CLIENT_EMAIL:-}
      AFENDOR_PUSH_FCM_PRIVATE_KEY: ${AFENDOR_PUSH_FCM_PRIVATE_KEY:-}
      AFENDOR_PUSH_FCM_PRIVATE_KEY_PATH: ${AFENDOR_PUSH_FCM_PRIVATE_KEY_PATH:-}
      AFENDOR_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH: ${AFENDOR_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH:-}
      AFENDOR_PUSH_FCM_TOKEN_URI: ${AFENDOR_PUSH_FCM_TOKEN_URI:-}
      AFENDOR_PUSH_FCM_APPS: ${AFENDOR_PUSH_FCM_APPS:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/fluxer-push", "healthcheck"]
      <<: *fluxer-app-healthcheck
      start_period: ${AFENDOR_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      nats: {condition: service_healthy}
      api: {condition: service_healthy}

  static-proxy:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-static:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_STATIC_PROXY_MEMORY_LIMIT:-256mb}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/avatars/0.png"]
      <<: *fluxer-healthcheck

  app-proxy:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-app-proxy-self-hosted:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_APP_PROXY_MEMORY_LIMIT:-256mb}
    environment:
      RUST_LOG: ${RUST_LOG:-}
      TOKIO_WORKER_THREADS: ${AFENDOR_TOKIO_WORKER_THREADS:-2}
      AFENDOR_APP_PROXY_PORT: "8080"
      AFENDOR_S3_PUBLIC_ENDPOINT: ${AFENDOR_S3_PUBLIC_ENDPOINT:-}
      AFENDOR_S3_BUCKET_UPLOADS: ${AFENDOR_S3_BUCKET_UPLOADS:-fluxer-uploads}
      AFENDOR_STATIC_CDN_ENDPOINT: ${AFENDOR_STATIC_CDN_ENDPOINT:-}
      AFENDOR_MEDIA_ENDPOINT: ${AFENDOR_MEDIA_ENDPOINT:-}
      AFENDOR_APP_PRODUCT_NAME: ${AFENDOR_APP_PRODUCT_NAME:-}
      AFENDOR_APP_ICON_URL: ${AFENDOR_APP_ICON_URL:-}
      AFENDOR_APP_SYMBOL_URL: ${AFENDOR_APP_SYMBOL_URL:-}
      AFENDOR_APP_LOGO_URL: ${AFENDOR_APP_LOGO_URL:-}
      AFENDOR_APP_WORDMARK_URL: ${AFENDOR_APP_WORDMARK_URL:-}
      AFENDOR_APP_FAVICON_URL: ${AFENDOR_APP_FAVICON_URL:-}
      AFENDOR_APP_FAVICON_DARK_URL: ${AFENDOR_APP_FAVICON_DARK_URL:-}
      AFENDOR_APP_SIGN_IN_BACKDROP_URL: ${AFENDOR_APP_SIGN_IN_BACKDROP_URL:-}
      AFENDOR_APP_THEME_COLOR: ${AFENDOR_APP_THEME_COLOR:-}
      AFENDOR_APP_STATUS_PAGE_URL: ${AFENDOR_APP_STATUS_PAGE_URL:-}
      DISCOVERY_UPSTREAM_URL: http://edge:8088/.well-known/fluxer
      DISCOVERY_REFRESH_INTERVAL_MS: ${DISCOVERY_REFRESH_INTERVAL_MS:-5000}
      AFENDOR_APP_PROXY_INDEX_UPSTREAM_URL: ${AFENDOR_APP_PROXY_INDEX_UPSTREAM_URL:-}
      AFENDOR_APP_PROXY_SAME_ORIGIN_HOSTS: ${AFENDOR_APP_PROXY_SAME_ORIGIN_HOSTS:-}
      AFENDOR_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS: ${AFENDOR_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS:-}
      AFENDOR_LIVEKIT_URL: ${AFENDOR_LIVEKIT_URL:-}
      AFENDOR_CSP_EXTRA_DEFAULT_SRC: ${AFENDOR_CSP_EXTRA_DEFAULT_SRC:-}
      AFENDOR_CSP_EXTRA_CONNECT_SRC: ${AFENDOR_CSP_EXTRA_CONNECT_SRC:-}
      AFENDOR_CSP_EXTRA_IMG_SRC: ${AFENDOR_CSP_EXTRA_IMG_SRC:-}
      AFENDOR_CSP_EXTRA_MEDIA_SRC: ${AFENDOR_CSP_EXTRA_MEDIA_SRC:-}
      AFENDOR_CSP_EXTRA_FONT_SRC: ${AFENDOR_CSP_EXTRA_FONT_SRC:-}
      AFENDOR_CSP_EXTRA_SCRIPT_SRC: ${AFENDOR_CSP_EXTRA_SCRIPT_SRC:-}
      AFENDOR_CSP_EXTRA_STYLE_SRC: ${AFENDOR_CSP_EXTRA_STYLE_SRC:-}
      AFENDOR_CSP_EXTRA_FRAME_SRC: ${AFENDOR_CSP_EXTRA_FRAME_SRC:-}
      AFENDOR_CSP_EXTRA_WORKER_SRC: ${AFENDOR_CSP_EXTRA_WORKER_SRC:-}
      AFENDOR_CSP_EXTRA_MANIFEST_SRC: ${AFENDOR_CSP_EXTRA_MANIFEST_SRC:-}
      AFENDOR_CSP_REPORT_URI: ${AFENDOR_CSP_REPORT_URI:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/_ready"]
      <<: *fluxer-healthcheck
      interval: ${AFENDOR_APP_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      api: {condition: service_healthy}
      edge: {condition: service_healthy}

  snowflakes:
    <<: *fluxer-service
    stop_grace_period: 30s
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-snowflakes:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_SNOWFLAKES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_SVC_NAME: snowflakes
      AFENDOR_SVC_MODE: combined
    healthcheck: *fluxer-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users:
    <<: *fluxer-service
    stop_grace_period: 30s
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-users:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_USERS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_SVC_NAME: users
      AFENDOR_SVC_MODE: combined
      AFENDOR_POSTGRES_MAX_CONNECTIONS: "${AFENDOR_USERS_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *fluxer-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  gifs:
    <<: *fluxer-service
    stop_grace_period: 30s
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-gifs:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_GIFS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_SVC_NAME: gifs
      AFENDOR_SVC_MODE: combined
      AFENDOR_GIFS_SHARD_CACHE_MAX_BYTES: ${AFENDOR_GIFS_SHARD_CACHE_MAX_BYTES:-134217728}
    healthcheck: *fluxer-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  messages:
    <<: *fluxer-service
    stop_grace_period: 30s
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-messages:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_MESSAGES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_SVC_NAME: messages
      AFENDOR_SVC_MODE: combined
      AFENDOR_POSTGRES_MAX_CONNECTIONS: "${AFENDOR_MESSAGES_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *fluxer-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  unfurl:
    <<: *fluxer-service
    stop_grace_period: 30s
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-unfurl:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_UNFURL_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_SVC_NAME: unfurl
      AFENDOR_SVC_MODE: combined
      AFENDOR_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
      AFENDOR_ACTIVITYPUB_SIGNING_KEY_BASE64: ${AFENDOR_ACTIVITYPUB_SIGNING_KEY_BASE64:-}
    healthcheck: *fluxer-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  admin:
    <<: *fluxer-service
    image: ${AFENDOR_REGISTRY:-ghcr.io/${AFENDOR_REGISTRY_OWNER:-fluxerapp}}/fluxer-admin:${AFENDOR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_ADMIN_MEMORY_LIMIT:-256mb}
    environment:
      <<: *fluxer-rust-env
      AFENDOR_ADMIN_PORT: "8080"
      AFENDOR_ADMIN_BASE_PATH: ${AFENDOR_ADMIN_BASE_PATH:-/admin}
      AFENDOR_API_ENDPOINT: http://api:8080
      AFENDOR_API_PUBLIC_ENDPOINT: ${AFENDOR_API_ENDPOINT:-}
      AFENDOR_STATIC_CDN_ENDPOINT: ${AFENDOR_STATIC_CDN_ENDPOINT:-${AFENDOR_PUBLIC_ORIGIN:-${AFENDOR_PUBLIC_SCHEME:-https}://${AFENDOR_DOMAIN:-}}}
      AFENDOR_ADMIN_SSO_CLIENT_SECRET: ${AFENDOR_ADMIN_SSO_CLIENT_SECRET:-}
      AFENDOR_ADMIN_SSO_DISPLAY_NAME: ${AFENDOR_ADMIN_SSO_DISPLAY_NAME:-}
      AFENDOR_ADMIN_SSO_ONLY: ${AFENDOR_ADMIN_SSO_ONLY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *fluxer-app-healthcheck
      start_period: ${AFENDOR_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      api: {condition: service_healthy}

networks:
  fluxer:
    driver: bridge

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  nats-data:
  meilisearch-data:
  seaweedfs-data:
  media-proxy-tmp:
