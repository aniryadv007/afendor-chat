      AFENDOR_MEDIA_PROXY_TRANSFORM_CACHE_TTL_MS: ${AFENDOR_MEDIA_PROXY_TRANSFORM_CACHE_TTL_MS:-}
      AFENDOR_MEDIA_PROXY_SOCKET_IO_TIMEOUT_MS: ${AFENDOR_MEDIA_PROXY_SOCKET_IO_TIMEOUT_MS:-}
      AFENDOR_MEDIA_PROXY_SHUTDOWN_GRACE_MS: ${AFENDOR_MEDIA_PROXY_SHUTDOWN_GRACE_MS:-}
      AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_S3_TIMEOUT_MS: ${AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_S3_TIMEOUT_MS:-}
      AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_BYTES: ${AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_BYTES:-}
      AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_TOTAL_BYTES: ${AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_TOTAL_BYTES:-}
      AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_DIR: ${AFENDOR_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_DIR:-}
