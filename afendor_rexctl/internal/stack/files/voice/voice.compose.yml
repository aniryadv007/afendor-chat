services:
  livekit:
    image: ${AFENDOR_LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    restart: unless-stopped
    stop_grace_period: ${AFENDOR_VOICE_STOP_GRACE:-15m}
    deploy:
      resources:
        limits:
          memory: ${AFENDOR_VOICE_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: ${AFENDOR_LOG_MAX_SIZE:-10m}
        max-file: "${AFENDOR_LOG_MAX_FILE:-3}"
    environment:
      GOMEMLIMIT: ${AFENDOR_VOICE_GOMEMLIMIT:-1700MiB}
      LIVEKIT_KEYS: "${AFENDOR_VOICE_API_KEY:?Set AFENDOR_VOICE_API_KEY}: ${AFENDOR_VOICE_API_SECRET:?Set AFENDOR_VOICE_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${AFENDOR_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${AFENDOR_VOICE_TCP_PORT:-7881}
          udp_port: ${AFENDOR_VOICE_UDP_PORT:-7882}
          use_external_ip: ${AFENDOR_VOICE_USE_EXTERNAL_IP:-true}
          node_ip: "${AFENDOR_VOICE_NODE_IP:-}"
          ips:
            includes: ${AFENDOR_VOICE_ICE_IPS:-[]}
          stun_servers:
            - ${AFENDOR_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${AFENDOR_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
          turn_servers: ${AFENDOR_LIVEKIT_TURN_SERVERS:-[]}
        turn:
          enabled: false
        webhook:
          api_key: ${AFENDOR_VOICE_API_KEY:?Set AFENDOR_VOICE_API_KEY}
          urls:
            - ${AFENDOR_VOICE_WEBHOOK_URL:?Set AFENDOR_VOICE_WEBHOOK_URL}
    ports:
      - "${AFENDOR_VOICE_BIND_IP:+${AFENDOR_VOICE_BIND_IP}:}${AFENDOR_VOICE_TCP_PORT:-7881}:${AFENDOR_VOICE_TCP_PORT:-7881}/tcp"
      - "${AFENDOR_VOICE_BIND_IP:+${AFENDOR_VOICE_BIND_IP}:}${AFENDOR_VOICE_UDP_PORT:-7882}:${AFENDOR_VOICE_UDP_PORT:-7882}/udp"
    networks:
      voice:
        aliases:
          - voice-${AFENDOR_VOICE_ID:?Set AFENDOR_VOICE_ID}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  voice:
    external: true
    name: ${AFENDOR_VOICE_NETWORK:-fluxer-voice}
