# ==============================================================================
# AFENDOR CHAT - AUTOMATED DOCKER CONTAINER IMAGE BUILD & GHCR PUBLISH
# ==============================================================================

name: Build & Publish Docker Images to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: latest)'
        required: true
        default: 'latest'
  push:
    branches:
      - main
    paths:
      - 'afendor_*/**'
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/build-and-publish-images.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: afendor-api
            dockerfile: afendor_api/Dockerfile
            context: .
          - service: afendor-app-proxy
            dockerfile: afendor_app_proxy/Dockerfile
            context: .
          - service: afendor-gateway
            dockerfile: afendor_gateway/Dockerfile
            context: .
          - service: afendor-media-proxy
            dockerfile: afendor_media_proxy/Dockerfile
            context: .
          - service: afendor-admin
            dockerfile: afendor_admin/Dockerfile
            context: .
          - service: afendor-push
            dockerfile: afendor_push/Dockerfile
            context: .
          - service: afendor-snowflakes
            dockerfile: afendor_snowflakes/Dockerfile
            context: .
          - service: afendor-users
            dockerfile: afendor_users/Dockerfile
            context: .
          - service: afendor-gifs
            dockerfile: afendor_gifs/Dockerfile
            context: .
          - service: afendor-messages
            dockerfile: afendor_messages/Dockerfile
            context: .
          - service: afendor-unfurl
            dockerfile: afendor_unfurl/Dockerfile
            context: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
